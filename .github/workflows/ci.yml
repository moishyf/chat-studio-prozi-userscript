name: Verify build and original parity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- dist src/assets/recipes.json
      - uses: actions/upload-artifact@v4
        with:
          name: chat-studio-reviewed-build
          path: dist/
